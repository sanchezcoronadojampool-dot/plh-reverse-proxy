location = /proyecto2 {
    return 301 /proyecto2/;
}

location /proyecto2/api/ {
    set $app plh-serv-frontend:80;
    rewrite ^/proyecto2/api/(.*)$ /api/$1 break;
    proxy_pass http://$app;
    proxy_cookie_path / /proyecto2/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /proyecto2/ {
    set $app plh-serv-frontend:80;
    rewrite ^/proyecto2/(.*)$ /$1 break;
    proxy_pass http://$app;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
