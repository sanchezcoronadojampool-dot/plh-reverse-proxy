services:
  nginx:
    image: nginx:1.28-alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./projects:/etc/nginx/projects:ro
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: web
